[project]
name = "chatbot-fastapi"
version = "0.1.0"
description = "FastAPI + CrewAI Gateway for GLPI IT Asset Management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.6.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "litellm>=1.83.14",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
